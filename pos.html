<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAMIL FOOD POS</title>
<style>
*{box-sizing:border-box}body{font:15px Arial;margin:0;background:#fff9ef;color:#211b16}.top{background:#2c2118;color:white;padding:16px}.wrap{max-width:1000px;margin:20px auto;padding:0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{background:white;border:1px solid #e5d8c8;border-radius:9px;padding:15px}input,select,textarea{width:100%;padding:10px;margin:5px 0 12px;border:1px solid #d8cbbb;border-radius:5px;font:inherit}.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:1px solid #eee;padding:9px;border-radius:6px}.item button,.btn{background:#d65a24;color:white;border:0;padding:10px;border-radius:5px;cursor:pointer}.btn.dark{background:#2c2118}.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:9px 0}.row button{padding:3px 8px}.total{font-size:18px;font-weight:bold;display:flex;justify-content:space-between;padding:14px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:12px;color:#766b60}#paper{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{@page{size:80mm auto;margin:3mm}body *{visibility:hidden!important}#paper,#paper *{visibility:visible!important}#paper{display:block!important;position:absolute;left:0;top:0;width:74mm;font:12px Arial;color:black}.center{text-align:center}.line{border-top:1px dashed;margin:7px 0}.right{text-align:right}}
</style></head><body><header class="top"><b>TAMIL FOOD — KOT & BILL</b></header><main class="wrap"><div class="grid"><section class="box"><h2>Menu</h2><input id="search" placeholder="Search food"><div id="items" class="items"></div></section><section class="box"><h2>New Order</h2>
<label>Order type<select id="type"><option>Dine-in</option><option>Takeaway</option><option>Delivery</option></select></label>
<label>Table<select id="table"><option value="">Select table</option></select></label><label>Steward<select id="steward"><option value="">Select steward</option></select></label>
<label>Order number<input id="no" readonly></label><label>Note<textarea id="note" rows="2"></textarea></label><div id="cart">No items added.</div><div class="total"><span>Total</span><span id="total">Rs. 0.00</span></div><div class="actions"><button class="btn dark" id="kot">Print KOT</button><button class="btn" id="bill">Print Bill</button></div><p class="hint">Print dialog: select Xprinter XP-80T, 80mm paper, disable browser headers and footers.</p></section></div></main><div id="paper"></div>
<script>
const $=id=>document.getElementById(id),cash=n=>'Rs. '+Number(n||0).toFixed(2);let menu=[],cart=[];
for(let i=1;i<=20;i++)$('table').add(new Option('Table '+i,i));
['Chanaka','Danushka','Supun','Praath','Vihaga','Kesara','Bashitha'].forEach(n=>$('steward').add(new Option(n,n)));
$('no').value='TF-'+Date.now().toString().slice(-6);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const fallback=[['Chicken Kottu','KOTHTHU',950],['Chicken Rice & Curry','RICE & CURRY',450],['Chicken Rice','RICE',0],['Egg Rice','RICE',0],['Vegetable Rice','RICE',0],['Egg Koththu','KOTHTHU',0],['Chicken Biriyani','BIRIYANI',0],['Fish Rice & Curry','RICE & CURRY',0],['Vegetable Rice & Curry','RICE & CURRY',0],['Egg Rice & Curry','RICE & CURRY',0]].map(x=>({name:x[0],category:x[1],price:x[2]}));
menu=fallback;
try{let c=JSON.parse(localStorage.getItem('tamilFoodConfig_v2'));if(c?.menu?.length)menu=c.menu}catch(e){}
fetch('tamil-food-settings.json').then(r=>r.ok?r.json():null).then(c=>{if(c?.menu?.length&&!localStorage.getItem('tamilFoodConfig_v2')){menu=c.menu;drawMenu()}}).catch(()=>{});
function drawMenu(){let q=$('search').value.toLowerCase(),found=menu.filter(x=>(x.name+' '+x.category).toLowerCase().includes(q));$('items').innerHTML=found.map((x,i)=>'<div class="item"><b>'+esc(x.name)+'</b><br><small>'+esc(x.category||'')+' · '+cash(x.price)+'</small><br><button data-add="'+i+'">Add</button></div>').join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let x=found[+b.dataset.add],v=cart.find(y=>y.name===x.name);v?v.qty++:cart.push({name:x.name,price:+x.price||0,qty:1});drawCart()})}
function drawCart(){$('cart').innerHTML=cart.length?cart.map((x,i)=>'<div class="row"><span>'+esc(x.name)+'<br>'+cash(x.price)+'</span><span><button data-minus="'+i+'">−</button> '+x.qty+' <button data-plus="'+i+'">+</button></span><b>'+cash(x.price*x.qty)+'</b></div>').join(''):'No items added.';document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{let i=+b.dataset.minus;if(--cart[i].qty<1)cart.splice(i,1);drawCart()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{cart[+b.dataset.plus].qty++;drawCart()});$('total').textContent=cash(cart.reduce((s,x)=>s+x.price*x.qty,0))}
function print(kind){if(!cart.length)return alert('Add food items first.');if($('type').value==='Dine-in'&&!$('table').value)return alert('Select a table.');let k=kind==='KOT',sum=cart.reduce((s,x)=>s+x.price*x.qty,0);$('paper').innerHTML='<div class="center"><h2>TAMIL FOOD</h2>'+ (k?'KITCHEN ORDER TICKET':'CUSTOMER BILL')+'</div><div class="line"></div>Order: '+esc($('no').value)+'<br>'+new Date().toLocaleString()+'<br>Type: '+esc($('type').value)+'<br>Table: '+esc($('table').value||'—')+'<br>Steward: '+esc($('steward').value||'—')+'<div class="line"></div>'+cart.map(x=>esc(x.name)+' &nbsp; x '+x.qty+(k?'':' &nbsp; '+cash(x.price*x.qty))).join('<br>')+(k?'':'<div class="line"></div><b>TOTAL: '+cash(sum)+'</b>')+($('note').value?'<div class="line"></div>Note: '+esc($('note').value):'')+'<div class="line"></div><div class="center">'+(k?'PLEASE PREPARE':'Thank you! Come again.')+'</div>';window.print()}
$('search').oninput=drawMenu;$('kot').onclick=()=>print('KOT');$('bill').onclick=()=>print('BILL');drawMenu();drawCart();
</script></body></html>
